<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">FormReady — Photo and signature resizer</title>
  <desc id="description">A photo crop frame and measured file checks for preparing an image for an online form.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5f1"/><stop offset="1" stop-color="#efe5dc"/></linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#493c34" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1150" cy="600" r="270" fill="#e9d6c8" opacity=".62"/>
  <circle cx="95" cy="48" r="190" fill="#e8eae2" opacity=".7"/>
