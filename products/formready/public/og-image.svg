  <text x="151" y="128" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="-1.2" fill="#252c2c">FormReady</text>
  <text x="82" y="261" font-family="Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-2.5" fill="#252c2c">Photo &amp; signature prep</text>
  <text x="84" y="319" font-family="Arial,sans-serif" font-size="26" fill="#5a605b">Set the pixels. Measure the file. Check the crop.</text>
